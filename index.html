<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Annie 的暴富人生</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang TC',sans-serif;background:#F5FAFA;color:#2D2D2D;font-size:17px}
.hdr{background:#2D2D2D;color:#fff;padding:0 1rem;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:99;-webkit-tap-highlight-color:transparent}
.logo{font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px;white-space:nowrap}
.logo b{color:#0ABAB5}
.nav{display:flex;gap:2px}
.nb{background:none;border:none;color:rgba(255,255,255,.4);font-family:inherit;font-size:13px;font-weight:600;padding:8px 12px;border-radius:7px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.nb.on{background:rgba(10,186,181,.15);color:#0ABAB5}
.main{max-width:1320px;margin:0 auto;padding:1rem;position:relative;z-index:1}
.view{display:none}.view.on{display:block}

/* TOP STATS - 看板用 4欄 */
.stats5k{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:1rem}
@media(max-width:800px){.stats5k{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.stats5k{grid-template-columns:repeat(2,1fr)}}
/* TOP STATS - 清單用 5欄 */
.stats5{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:1rem}
@media(max-width:900px){.stats5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.stats5{grid-template-columns:repeat(2,1fr)}}
.sc{background:#fff;border:1px solid #D4F0EE;border-radius:10px;padding:12px 14px}
.sl{font-size:13px;font-weight:600;color:#5A9E99;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.sv{font-size:24px;font-weight:300;font-family:'Futura','Century Gothic',sans-serif;color:#2D2D2D}
.ss{font-size:13px;color:#5A9E99;margin-top:1px}

/* UPCOMING - 只在看板顯示 */
.upcoming{background:#fff;border:1px solid #D4F0EE;border-radius:12px;padding:16px 20px;margin-bottom:1rem}
.upcoming-title{font-size:13px;font-weight:700;color:#5A9E99;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.upcoming-title::after{content:'';flex:1;height:1px;background:#EEF8F7}
.up-item{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid #F0F9F8}
.up-item:last-child{border-bottom:none;padding-bottom:0}
.up-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.up-line{width:2px;height:34px;border-radius:2px;flex-shrink:0}
.up-info{min-width:0}
.up-brand{font-size:15px;font-weight:700;color:#2D2D2D}
.up-detail{font-size:13px;color:#5A9E99;margin-top:1px}
.up-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.up-stage{font-size:13px;font-weight:600;color:#5A9E99;background:#EEF8F7;padding:2px 9px;border-radius:20px}
.up-days{font-family:'Futura','Century Gothic',sans-serif;font-size:13px;font-weight:300;color:#2D2D2D;min-width:52px;text-align:right}
.up-empty{font-size:13px;color:#7ED8D5;text-align:center;padding:6px 0}

/* SECTION */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.st{font-size:17px;font-weight:800}
.bp{background:#0ABAB5;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:start}
@media(max-width:1100px){.kanban{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.kanban{grid-template-columns:repeat(2,1fr)}}
@media(max-width:380px){.kanban{grid-template-columns:1fr}}
.kcol{background:#F8FCFC;border:1px solid #D4F0EE;border-radius:10px;padding:9px;min-height:160px}
.kct{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#3D7875;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.kdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.kn{margin-left:auto;font-size:13px;font-weight:600;color:#7ED8D5}
.kcard{background:#fff;border:1px solid #E8F7F6;border-radius:8px;padding:9px 11px;margin-bottom:6px;cursor:pointer;transition:border-color .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.kcard:hover{border-color:#0ABAB5}
.kcard:active{border-color:#0ABAB5;background:#F8FCFC}
.kb{font-size:15px;font-weight:700;margin-bottom:2px;color:#2D2D2D}
.kt{font-size:13px;color:#5A9E99;margin-bottom:6px}
.km{display:flex;justify-content:space-between;align-items:center}
.kf{font-family:'Futura','Century Gothic',sans-serif;font-size:13px;font-weight:300;color:#2D2D2D}
.kd{font-size:13px;color:#7ED8D5}
.kw{border-left:2px solid #E8A87C;padding-left:6px;font-size:13px;color:#B07840;margin-top:6px}
.kw.err{border-color:#E07C72;color:#B04040}
.ke{text-align:center;padding:16px 0;color:#C8ECEB;font-size:11px}

/* TABLE */
.twrap{background:#fff;border:1px solid #D4F0EE;border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5A9E99;padding:10px 12px;text-align:left;background:#F8FCFC;border-bottom:1px solid #D4F0EE;white-space:nowrap}
tbody tr{border-bottom:1px solid #EEF8F7}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#F8FCFC}
td{padding:10px 8px;font-size:13px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-type{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbr{font-weight:700}
.tfe{font-family:'Futura','Century Gothic',sans-serif;font-size:13px;font-weight:500;color:#0ABAB5}
.tda{font-family:'Futura','Century Gothic',sans-serif;font-size:13px;font-weight:300;color:#5A9E99}
.ib{background:none;border:1px solid #D4F0EE;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:13px;color:#5A9E99}
.ib:hover{border-color:#0ABAB5;color:#0ABAB5}

/* BADGE */
.badge{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap}
.b-script{background:#EBF4FB;color:#2471A3}
.b-shoot {background:#FDF0E6;color:#A0602A}
.b-edit  {background:#F0EBFA;color:#6B3FAA}
.b-review{background:#FCEAF5;color:#A03080}
.b-pub   {background:#FDF9E0;color:#B8960A}   /* 橘色 - 待發布 */
.b-pay   {background:#FDE8E6;color:#B84040}
.b-done  {background:#EEF8F7;color:#3D7875}

/* CHARTS */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.cgrid{grid-template-columns:1fr}}
.ccard{background:#fff;border:1px solid #D4F0EE;border-radius:10px;padding:16px 18px}
.ctit{font-size:13px;font-weight:700;margin-bottom:12px;color:#2D2D2D}
.cwrap{position:relative;height:200px}

/* 收入摘要卡 in charts */
.income-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:700px){.income-grid{grid-template-columns:repeat(2,1fr)}}
.ic{background:#F8FCFC;border:1px solid #D4F0EE;border-radius:8px;padding:12px 14px}
.il{font-size:13px;font-weight:600;color:#5A9E99;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.iv{font-size:18px;font-weight:300;font-family:'Futura','Century Gothic',sans-serif}
.is{font-size:13px;color:#7ED8D5;margin-top:1px}

/* TRACKER */
/* 追蹤頁頂部小統計 */
.tracker-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:1rem}
@media(max-width:900px){.tracker-stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.tracker-stats{grid-template-columns:repeat(2,1fr)}}
.tsc{background:#fff;border:1px solid #D4F0EE;border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:8px}
.tsc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tsc-info{min-width:0}
.tsc-label{font-size:13px;font-weight:600;color:#5A9E99;white-space:nowrap}
.tsc-val{font-size:18px;font-weight:300;font-family:'Futura','Century Gothic',sans-serif;color:#2D2D2D}
/* 追蹤清單 */
.tracker{display:flex;flex-direction:column;gap:10px}
.trsec{background:#fff;border:1px solid #D4F0EE;border-radius:10px;overflow:hidden}
.trsec-hd{padding:11px 16px;display:flex;align-items:center;gap:8px}
.trsec-dot{width:8px;height:8px;border-radius:50%}
.trsec-title{font-size:15px;font-weight:700;color:#2D2D2D}
.trsec-count{font-size:13px;color:#5A9E99;margin-left:auto;font-family:'Futura','Century Gothic',sans-serif;font-weight:300}
.tritem{display:flex;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid #EEF8F7}
.tr-brand{font-size:15px;font-weight:700;color:#2D2D2D}
.tr-type{font-size:13px;color:#5A9E99;margin-top:1px}
.tr-date{font-family:'Futura','Century Gothic',sans-serif;font-size:13px;font-weight:300;color:#7ED8D5;margin-left:auto;white-space:nowrap}
.tr-days{font-family:'Futura','Century Gothic',sans-serif;font-size:13px;font-weight:300;padding:2px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.tr-days.ok{background:#EEF8F7;color:#3D7875}
.tr-days.warn{background:#FDF0E6;color:#A06030}
.tr-days.urgent{background:#FDE8E6;color:#B84040}
.tr-fee{font-family:'Futura','Century Gothic',sans-serif;font-size:13px;font-weight:300;color:#5A9E99;min-width:90px;text-align:right}
.tr-empty{padding:10px 16px;font-size:13px;color:#7ED8D5;border-top:1px solid #EEF8F7}

/* MODAL */
.mbg{display:none;position:fixed;inset:0;background:rgba(45,45,45,.4);z-index:200;align-items:center;justify-content:center;padding:1rem;-webkit-overflow-scrolling:touch}
.mbg.on{display:flex}
.modal{background:#fff;border-radius:14px;padding:22px;width:480px;max-width:calc(100vw - 2rem);max-height:85vh;overflow-y:auto;border:1px solid #D4F0EE;-webkit-overflow-scrolling:touch}
.modal h3{font-size:17px;font-weight:800;margin-bottom:16px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr.full{grid-column:1/-1}
.fsec{grid-column:1/-1;font-size:13px;font-weight:700;color:#5A9E99;letter-spacing:.06em;text-transform:uppercase;padding-top:8px;border-top:1px solid #EEF8F7;margin-top:2px}
.fr label{display:block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5A9E99;margin-bottom:4px}
.fr input,.fr select{width:100%;background:#F8FCFC;border:1px solid #D4F0EE;border-radius:7px;padding:8px 10px;font-family:inherit;font-size:13px;color:#2D2D2D;outline:none}
.fr input:focus,.fr select:focus{border-color:#0ABAB5;background:#fff}
.mact{display:flex;gap:8px;margin-top:16px}
.bcl{flex:1;background:none;border:1px solid #D4F0EE;border-radius:8px;padding:12px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;touch-action:manipulation}
.bsv{flex:2;background:#0ABAB5;color:#fff;border:none;border-radius:8px;padding:12px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;touch-action:manipulation}
</style>
</head>
<body>
<header class="hdr">
  <div class="logo"><b>✦</b> Annie 的暴富人生</div>
  <nav class="nav">
    <button class="nb on" onclick="sv('kanban')">總覽</button>
    <button class="nb" onclick="sv('table')">清單</button>
    <button class="nb" onclick="sv('charts')">圖表</button>
    <button class="nb" onclick="sv('tracker')">追蹤</button>
  </nav>
</header>

<!-- Loading overlay -->
<div id="loading" style="display:none;position:fixed;inset:0;background:rgba(245,250,250,.9);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:12px">
  <div style="width:32px;height:32px;border:3px solid #D4F0EE;border-top-color:#0ABAB5;border-radius:50%;animation:spin 0.8s linear infinite"></div>
  <div style="font-size:13px;color:#5A9E99">載入資料中...</div>
</div>

<!-- Saving indicator -->
<div id="saving" style="display:none;position:fixed;bottom:20px;right:20px;background:#2D2D2D;color:#fff;padding:8px 16px;border-radius:8px;font-size:12px;z-index:998;align-items:center;gap:8px">
  <div style="width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#0ABAB5;border-radius:50%;animation:spin 0.8s linear infinite"></div>
  同步中...
</div>

<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<main class="main">
  <!-- 總覽 -->
  <div class="view on" id="view-kanban">
    <div class="stats5k" id="stats-kanban"></div>
    <div class="upcoming" id="upcoming"></div>
    <div class="sh"><div class="st">合作看板</div><button class="bp" onclick="openM()">＋ 新增</button></div>
    <div class="kanban" id="board"></div>
  </div>

  <!-- 清單 -->
  <div class="view" id="view-table">
    <div class="stats5" id="stats-table"></div>
    <div class="sh"><div class="st">所有合作</div><button class="bp" onclick="openM()">＋ 新增</button></div>
    <div class="twrap"><table>
      <colgroup><col style="width:12%"><col style="width:15%"><col style="width:8%"><col style="width:6%"><col style="width:6%"><col style="width:6%"><col style="width:7%"><col style="width:7%"><col style="width:7%"><col style="width:7%"><col style="width:5%"><col style="width:4%"></colgroup>
      <thead><tr>
        <th onclick="sortTable('brand')" style="cursor:pointer">品牌 <span id="sort-brand"></span></th>
        <th>項目</th>
        <th onclick="sortTable('fee')" style="cursor:pointer">費用 <span id="sort-fee"></span></th>
        <th onclick="sortTable('sc')" style="cursor:pointer">腳本日 <span id="sort-sc"></span></th>
        <th onclick="sortTable('sh')" style="cursor:pointer">拍攝日 <span id="sort-sh"></span></th>
        <th onclick="sortTable('dr')" style="cursor:pointer">交稿日 <span id="sort-dr"></span></th>
        <th onclick="sortTable('pd')" style="cursor:pointer">發文日 <span id="sort-pd"></span></th>
        <th onclick="sortTable('py')" style="cursor:pointer">撥款日 <span id="sort-py"></span></th>
        <th onclick="sortTable('ar')" style="cursor:pointer">實際收款日 <span id="sort-ar"></span></th>
        <th onclick="sortTable('status')" style="cursor:pointer">狀態 <span id="sort-status"></span></th>
        <th>備註</th><th></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
  </div>

  <!-- 圖表 -->
  <div class="view" id="view-charts">
    <div class="cgrid">
      <div class="ccard"><div class="ctit">月份收入趨勢</div><div class="cwrap"><canvas id="cm"></canvas></div></div>
      <div class="ccard"><div class="ctit">品牌收入排名</div><div class="cwrap"><canvas id="cb"></canvas></div></div>
      <div class="ccard"><div class="ctit">合作狀態分佈</div><div class="cwrap"><canvas id="cs"></canvas></div></div>
      <div class="ccard"><div class="ctit">每月平均案件費用</div><div class="cwrap"><canvas id="ca"></canvas></div></div>
      <div class="ccard"><div class="ctit">本月 vs 下月預計收入</div><div class="cwrap"><canvas id="cmonth"></canvas></div></div>
      <div class="ccard"><div class="ctit">收款狀態（未撥款 vs 累計）</div><div class="cwrap"><canvas id="cpay"></canvas></div></div>
    </div>
  </div>

  <!-- 追蹤 -->
  <div class="view" id="view-tracker">
    <div class="tracker-stats" id="tracker-stats"></div>
    <div class="tracker" id="tracker"></div>
  </div>
</main>

<!-- MODAL -->
<div class="mbg" id="modal" onclick="closeM(event)">
  <div class="modal">
    <h3 id="mtitle">新增品牌合作</h3>
    <div class="fg">
      <div class="fsec">基本資訊</div>
      <div class="fr full"><label>合作品牌</label><input id="fb" type="text" placeholder="例：NARS"></div>
      <div class="fr full"><label>合作項目</label><input id="ftype" type="text" placeholder="例：開箱業配"></div>
      <div class="fr"><label>費用 (NT$)</label><input id="ffee" type="number" placeholder="0"></div>
      <div class="fr"><label>狀態</label>
        <select id="fst">
          <option>腳本撰寫</option><option>待拍攝</option><option>待剪輯</option>
          <option>校稿中</option><option>待發布</option><option>待收款</option><option>已完成</option>
        </select>
      </div>
      <div class="fsec">時間軸</div>
      <div class="fr"><label>腳本日期</label><input id="fsc" type="date"></div>
      <div class="fr"><label>拍攝日</label><input id="fsh" type="date"></div>
      <div class="fr"><label>交稿日</label><input id="fdr" type="date"></div>
      <div class="fr"><label>發文日</label><input id="fpd" type="date"></div>
      <div class="fr"><label>預計撥款日</label><input id="fpy" type="date"></div>
      <div class="fr"><label>實際收款日</label><input id="far" type="date"></div>
      <div class="fsec">其他</div>
      <div class="fr full"><label>備註</label><input id="fnote" type="text" placeholder="例：需附發票"></div>
    </div>
    <div class="mact">
      <button class="bcl" onclick="closeM()">取消</button>
      <button class="bsv" onclick="saveE()">儲存</button>
    </div>
  </div>
</div>

<script>
const KANBAN_ST=['腳本撰寫','待拍攝','待剪輯','校稿中','待發布','待收款'];
const SC={
  '腳本撰寫':{b:'b-script',d:'#2471A3'},
  '待拍攝':  {b:'b-shoot', d:'#C8783A'},
  '待剪輯':  {b:'b-edit',  d:'#7D4FC0'},
  '校稿中':  {b:'b-review',d:'#B03090'},
  '待發布':  {b:'b-pub',   d:'#C9A800'},  /* 橘色 */
  '待收款':{b:'b-pay',   d:'#C84040'},
  '已完成':  {b:'b-done',  d:'#3D7875'},
};
const PAL=['#0ABAB5','#2471A3','#C8783A','#7D4FC0','#B03090','#C9A800','#C84040'];

const DL_MAP={
  '腳本撰寫':{key:'sc',label:'腳本'},
  '待拍攝':  {key:'sh',label:'拍攝'},
  '待剪輯':  {key:'dr',label:'交稿'},
  '校稿中':  {key:'dr',label:'交稿'},
  '待發布':  {key:'pd',label:'發文'},
  '待收款':{key:'py',label:'撥款'},
};
const SCAN_DL=[
  {key:'sc',label:'腳本',statuses:['腳本撰寫']},
  {key:'sh',label:'拍攝',statuses:['待拍攝']},
  {key:'dr',label:'交稿',statuses:['待剪輯','校稿中']},
  {key:'pd',label:'發文',statuses:['待發布']},
];

const BUILTIN_DATA=[
  {id:131,brand:'安妞美學',type:'肉毒+廣告+官網投廣各1',fee:9000,sc:'',sh:'',dr:'',pd:'2026-05-19',py:'2026-06-29',ar:'',status:'待收款',note:'聖洋科技'},
  {id:130,brand:'Dr.WU',type:'美顏濾鏡UV妝前乳',fee:6000,sc:'2026-05-25',sh:'2026-06-01',dr:'2026-06-05',pd:'2026-06-15',py:'2026-07-15',ar:'',status:'待拍攝',note:''},
  {id:129,brand:'KATE',type:'Threads照片文',fee:1500,sc:'',sh:'',dr:'',pd:'2026-05-25',py:'2026-06-26',ar:'',status:'待收款',note:''},

function processSheetData(json){
  if(json.status==='ok' && json.data && json.data.length>0){
    data = json.data.map(e=>({
      ...e,
      id: Number(e.id)||0,
      fee: Number(e.fee)||0,
      sc: fmtDate(e.sc), sh: fmtDate(e.sh),
      dr: fmtDate(e.dr), pd: fmtDate(e.pd),
      py: fmtDate(e.py), ar: fmtDate(e.ar),
    })).filter(e=>e.id>0);
    nid = Math.max(...data.map(e=>e.id)) + 1;
    window._dataSource = 'sheet';
    return true;
  }
  return false;
}

function useBultin(){
  data = BUILTIN_DATA.map(e=>({...e}));
  nid = Math.max(...data.map(e=>e.id)) + 1;
  window._dataSource = 'builtin';
}

async function loadData(){
  document.getElementById('loading').style.display='flex';
  let loaded = false;

  // 方法1: fetch
  try {
    const res = await Promise.race([
      fetch(SCRIPT_URL + '?t=' + Date.now()),
      new Promise((_,r) => setTimeout(() => r(new Error('timeout')), 6000))
    ]);
    const json = await res.json();
    loaded = processSheetData(json);
  } catch(e1) {
    // 方法2: JSONP fallback
    try {
      loaded = await new Promise((resolve) => {
        const timer = setTimeout(() => resolve(false), 6000);
        window._sheetCB = function(json){
          clearTimeout(timer);
          const s=document.getElementById('jsonp-s');if(s)s.remove();
          resolve(processSheetData(json));
        };
        const s = document.createElement('script');
        s.id = 'jsonp-s';
        s.src = SCRIPT_URL + '?callback=_sheetCB&t=' + Date.now();
        s.onerror = () => { clearTimeout(timer); resolve(false); };
        document.head.appendChild(s);
      });
    } catch(e2) { loaded = false; }
  }

  if(!loaded) useBultin();
  document.getElementById('loading').style.display='none';
  rAll();
}

async function initData(){
  await fetch(SCRIPT_URL, {
    method:'POST',
    body: JSON.stringify({action:'init'})
  });
  await saveData(BUILTIN_DATA);
  data = BUILTIN_DATA;
  nid = Math.max(...data.map(e=>e.id)) + 1;
}

async function saveData(d){
  if(isSaving) return;
  isSaving = true;
  document.getElementById('saving').style.display='flex';
  try {
    const payload = JSON.stringify({action:'save', data: d||data});
    await fetch(SCRIPT_URL, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain'},
      body: payload
    });
  } catch(err){ console.error('儲存失敗', err); }
  isSaving = false;
  document.getElementById('saving').style.display='none';
}


function fmtDate(v){
  if(!v||v==='') return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(v))) return String(v);
  const d = new Date(v);
  if(!isNaN(d.getTime())){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  return String(v);
}
function td(){const d=new Date();d.setHours(0,0,0,0);return d;}
function daysLeft(s){if(!s)return null;return Math.ceil((new Date(s)-td())/864e5);}
function fmtM(v){return v?'NT$ '+Number(v).toLocaleString():'—';}
function getMonth(offset=0){const d=new Date();d.setMonth(d.getMonth()+offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}

function calcIncome(){
  const thisM=getMonth(0), nextM=getMonth(1);
  // 本月已收：ar在本月的已完成
  const thisAr=data.filter(e=>e.ar&&e.ar.startsWith(thisM)&&e.status==='已完成').reduce((s,e)=>s+(+e.fee||0),0);
  // 本月預計收入：py在本月且非已完成
  const thisInc=data.filter(e=>e.py&&e.py.startsWith(thisM)&&e.status!=='已完成').reduce((s,e)=>s+(+e.fee||0),0);
  // 下月預計收入：py在下月且非已完成
  const nextInc=data.filter(e=>e.py&&e.py.startsWith(nextM)&&e.status!=='已完成').reduce((s,e)=>s+(+e.fee||0),0);
  // 未撥款：所有非已完成的全部金額
  const unpaid=data.filter(e=>e.status!=='已完成').reduce((s,e)=>s+(+e.fee||0),0);
  // 累計收入：所有已完成
  const total_inc=data.filter(e=>e.status==='已完成').reduce((s,e)=>s+(+e.fee||0),0);
  return{thisAr,thisInc,nextInc,unpaid,total:total_inc};
}

let sortKey='', sortDir=1;
function sortTable(key){
  if(sortKey===key) sortDir*=-1;
  else { sortKey=key; sortDir=1; }
  // Update sort indicators
  document.querySelectorAll('[id^="sort-"]').forEach(el=>el.textContent='');
  const el=document.getElementById('sort-'+key);
  if(el) el.textContent=sortDir===1?' ↑':' ↓';
  rTable();
}

function rTable(){
  const d=v=>v||'<span style="color:#C8ECEB">—</span>';
  let rows=[...data];
  if(sortKey){
    rows.sort((a,b)=>{
      let av=a[sortKey]||'', bv=b[sortKey]||'';
      if(sortKey==='fee'){av=Number(a.fee)||0; bv=Number(b.fee)||0; return (av-bv)*sortDir;}
      const primary = av.localeCompare(bv, 'zh-TW')*sortDir;
      if(sortKey==='status' && primary===0){
        const ap=a.py||'9999', bp=b.py||'9999';
        return ap.localeCompare(bp);
      }
      return primary;
    });
  }
  document.getElementById('tbody').innerHTML=rows.map(e=>
    `<tr><td class="tbr">${e.brand}</td><td class="td-type" title="${e.type||''}">${e.type||'—'}</td>
    <td class="tfe">${fmtM(e.fee)}</td>
    <td class="tda">${d(e.sc)}</td><td class="tda">${d(e.sh)}</td>
    <td class="tda">${d(e.dr)}</td><td class="tda">${d(e.pd)}</td><td class="tda">${d(e.py)}</td>
    <td class="tda">${d(e.ar)}</td>
    <td><span class="badge ${SC[e.status]?.b||'b-done'}">${e.status}</span></td>
    <td style="color:#5A9E99;font-size:13px;max-width:130px;overflow:hidden;text-overflow:ellipsis">${e.note||'—'}</td>
    <td style="display:flex;gap:4px">
      <button class="ib" onclick="editE(${e.id})">✏</button>
      <button class="ib" onclick="delE(${e.id})" style="color:#C84040;border-color:#FDE8E6">✕</button>
    </td></tr>`
  ).join('');
}

  dc('cmonth');chs['cmonth']=new Chart(document.getElementById('cmonth'),{type:'bar',data:{labels:['本月預計收入','下月預計收入'],datasets:[{data:[thisInc,nextInc],backgroundColor:['#0ABAB5','#7ED8D5'],borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'$'+(v/1000)+'K'},grid:{color:'#EEF8F7'}},x:{grid:{display:false}}}}});
  // 未撥款 vs 累計收入
  dc('cpay');chs['cpay']=new Chart(document.getElementById('cpay'),{type:'doughnut',data:{labels:['未撥款','已收累計'],datasets:[{data:[unpaid,total],backgroundColor:['#C84040','#0ABAB5'],borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},padding:14,boxWidth:10}}}}});
}

/* 追蹤：頂部每狀態數量 + 未完成清單 */
function rTracker(){
  // 頂部小統計
  document.getElementById('tracker-stats').innerHTML=KANBAN_ST.map(s=>{
    const cnt=data.filter(e=>e.status===s).length;
    return`<div class="tsc">
      <span class="tsc-dot" style="background:${SC[s].d}"></span>
      <div class="tsc-info"><div class="tsc-label">${s}</div><div class="tsc-val">${cnt}</div></div>
    </div>`;
  }).join('');

  // 未完成追蹤清單
  const sections=[
    {status:'腳本撰寫',dateKey:'sc',dateLabel:'腳本日'},
    {status:'待拍攝',dateKey:'sh',dateLabel:'拍攝日'},
    {status:'待剪輯',dateKey:'dr',dateLabel:'交稿日'},
    {status:'校稿中',dateKey:'dr',dateLabel:'交稿日'},
    {status:'待發布',dateKey:'pd',dateLabel:'發文日'},
    {status:'待收款',dateKey:'py',dateLabel:'撥款日'},
  ];
  document.getElementById('tracker').innerHTML=sections.map(sec=>{
    const items=data.filter(e=>e.status===sec.status);
    // 排序：逾期優先，然後按日期近到遠
    items.sort((a,b)=>{
      const da=daysLeft(a[sec.dateKey])??999;
      const db=daysLeft(b[sec.dateKey])??999;
      return da-db;
    });
    const rows=items.map(e=>{
      const days=daysLeft(e[sec.dateKey]);
      const cls=days===null?'ok':days<0?'urgent':days<=5?'warn':'ok';
      const dl=days===null?'—':days<0?`逾期${Math.abs(days)}天`:days===0?'今天':days===1?'明天':`${days}天後`;
      return`<div class="tritem">
        <div style="flex:1;min-width:0"><div class="tr-brand">${e.brand}</div><div class="tr-type">${e.type||'—'}</div></div>
        <div class="tr-date">${e[sec.dateKey]||'—'}</div>
        <div class="tr-days ${cls}">${dl}</div>
        <div class="tr-fee">${fmtM(e.fee)}</div>
      </div>`;
    }).join('');
    return`<div class="trsec">
      <div class="trsec-hd">
        <span class="trsec-dot" style="background:${SC[sec.status].d}"></span>
        <span class="trsec-title">${sec.status}</span>
        <span class="trsec-count">${items.length} 件</span>
      </div>
      ${items.length?rows:`<div class="tr-empty">目前沒有案子 ✓</div>`}
    </div>`;
  }).join('');
}

function openM(){
  eid=null;
  document.getElementById('mtitle').textContent='新增品牌合作';
  ['fb','ftype','ffee','fsc','fsh','fdr','fpd','fpy','far','fnote'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fst').value='腳本撰寫';
  document.getElementById('modal').classList.add('on');
}
function editE(id){
  const e=data.find(x=>x.id===id);if(!e)return;
  eid=id;
  document.getElementById('mtitle').textContent='編輯合作';
  document.getElementById('fb').value=e.brand;
  document.getElementById('ftype').value=e.type;
  document.getElementById('ffee').value=e.fee;
  document.getElementById('fsc').value=e.sc||'';
  document.getElementById('fsh').value=e.sh||'';
  document.getElementById('fdr').value=e.dr||'';
  document.getElementById('fpd').value=e.pd||'';
  document.getElementById('fpy').value=e.py||'';
  document.getElementById('far').value=e.ar||'';
  document.getElementById('fst').value=e.status;
  document.getElementById('fnote').value=e.note||'';
  document.getElementById('modal').classList.add('on');
}
function closeM(ev){if(!ev||ev.target===document.getElementById('modal'))document.getElementById('modal').classList.remove('on');}
function saveE(){
  const d={brand:document.getElementById('fb').value.trim()||'未命名',type:document.getElementById('ftype').value.trim(),fee:document.getElementById('ffee').value,sc:document.getElementById('fsc').value,sh:document.getElementById('fsh').value,dr:document.getElementById('fdr').value,pd:document.getElementById('fpd').value,py:document.getElementById('fpy').value,ar:document.getElementById('far').value,status:document.getElementById('fst').value,note:document.getElementById('fnote').value.trim()};
  if(eid){const i=data.findIndex(e=>e.id===eid);data[i]={...data[i],...d};}
  else data.unshift({id:nid++,...d});
  document.getElementById('modal').classList.remove('on');
  rAll();
  saveData();
}
function delE(id){if(!confirm('確定刪除？'))return;data=data.filter(e=>e.id!==id);rAll();saveData();}
function rAll(){rStatsKanban();rStatsTable();rUpcoming();rKanban();rTable();if(cv==='charts')rCharts();if(cv==='tracker')rTracker();}
// 啟動時載入資料
loadData();
</script>
